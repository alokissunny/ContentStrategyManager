<!doctype html>
<!--
  THEME: technical  —  Swiss / brutalist grid, monospace accents, geometric.
  Copy this file once per slide as slide-01.html, slide-02.html, ...
  Per slide: edit the brand vars (once, keep identical across slides),
  swap the `layout-*` class, and fill the content.
  Layouts:  layout-hook (slide 1) | layout-content (slides 2..n-1) | layout-cta (last)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* --- BRAND: set once, keep identical on every slide --- */
    --bg:     #f4f4f1;
    --ink:    #14140f;
    --accent: #2563eb;
    --line:   rgba(20, 20, 15, 0.16);
    --font:   'Inter', system-ui, sans-serif;
    --mono:   'JetBrains Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; height: 100%; }
  .slide {
    width: 100vw; height: 100vh;
    box-sizing: border-box;
    padding: 80px;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 90px 90px;
    color: var(--ink);
    font-family: var(--font);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .meta {
    font-family: var(--mono); font-size: 20px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; margin: 0;
    display: flex; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 18px;
  }
  .meta .idx { color: var(--accent); }
  .heading { font-size: 64px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; margin: 36px 0 0; }
  .body {
    font-size: 26px; font-weight: 400; line-height: 1.62; margin: 22px 0 0;
    max-width: 90%; border-left: 4px solid var(--accent); padding-left: 26px;
  }
  .number {
    font-family: var(--mono); font-size: 132px; font-weight: 700;
    color: var(--accent); line-height: 1; margin: 0;
  }
  .footer {
    margin-top: auto; font-family: var(--mono); font-size: 19px;
    display: flex; justify-content: space-between;
    border-top: 2px solid var(--ink); padding-top: 18px;
  }
  .swipe { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--accent); margin-top: 30px; }

  .layout-hook    { justify-content: center; }
  .layout-hook .heading { font-size: 80px; margin-top: 28px; }
  .layout-content { justify-content: flex-start; }
  .layout-cta     { justify-content: center; }
</style>
</head>
<body>
  <!-- EXAMPLE: a content slide. Change `layout-content` per the guide above. -->
  <div class="slide layout-content">
    <p class="meta"><span>CAROUSEL</span><span class="idx">02 / 07</span></p>
    <p class="number">01</p>
    <h2 class="heading">Your headline is too vague</h2>
    <p class="body">
      &ldquo;Welcome to our platform&rdquo; tells the visitor nothing.
      Lead with the outcome: &ldquo;Ship docs in minutes, not days.&rdquo;
    </p>
    <div class="footer"><span>@yourhandle</span><span>roscodetech.com</span></div>
  </div>
</body>
</html>
