# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo, or sync an existing Blueprint.
services:
  # ── Customer product ─────────────────────────────────────────────────────
  - type: web
    name: igsignal-api
    runtime: node
    region: oregon
    # Not free: the free plan sleeps when idle (cold starts, a dropped
    # publish-due call) and is killed mid-run on long generations. Theme Apply
    # renders want memory — move to `standard` (2 GB) if it restarts on OOM.
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # A deploy's SIGTERM drains open requests and background runs (Theme Apply,
    # queued plan jobs) before exit — see server.js SHUTDOWN_GRACE_MS (240 s).
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      # Queued post generation: /posts/generate answers at once with a run id
      # and the BullMQ worker runs it; a restart resumes from the last phase
      # instead of losing the run. The worker runs inside this service until the
      # separate igsignal-gen-worker below is set up.
      - key: PLAN_QUEUE
        value: "1"
      - key: PLAN_WORKER_IN_API
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: igsignal-queue
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: igsignal-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Push notifications ("your plan is ready"). Web: `npx web-push
      # generate-vapid-keys`. iOS: an APNs auth key (.p8) from the Apple
      # Developer account. Unset → that channel is skipped. A plan worker
      # (PLAN_QUEUE) sends too, so give it the same values.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_INSTAGRAM_PROFILE_ACTOR
        value: apify/instagram-profile-scraper
      - key: APIFY_INSTAGRAM_POST_ACTOR
        value: apify/instagram-post-scraper
      - key: INSTAGRAM_POSTS_LIMIT
        value: "12"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Instagram API with Instagram Login (Connect Instagram → publish).
      # App ID is the Instagram app ID, not the Facebook app ID.
      - key: INSTAGRAM_APP_ID
        value: "1657643289651015"
      # Instagram app secret: set in the Render dashboard, never committed.
      - key: INSTAGRAM_APP_SECRET
        sync: false
      # Must exactly match an OAuth redirect URI in Instagram Business login settings.
      # Production custom domain (also whitelist https://www.bauhly.com/… there).
      - key: META_REDIRECT_URI
        value: https://bauhly.com/dashboard/meta/callback
      # 1 enables live Graph publishing; needs public HTTPS image URLs (see notes).
      - key: META_PUBLISH_LIVE
        value: "1"
      # Shared secret for POST /api/internal/publish-due (daily scheduled-publish cron).
      - key: SCHEDULE_CRON_SECRET
        generateValue: true
      # Legacy Facebook Login for Business (unused by Connect Instagram).
      - key: META_APP_ID
        value: "965034379672554"
      - key: META_APP_SECRET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REPORT_PRESIGN_EXPIRY_SECONDS
        value: "3600"
      # CloudFront CDN base URL for project media (e.g. https://d111abcdef8.cloudfront.net
      # or a custom domain). When set, media is served from stable, cacheable CDN
      # URLs instead of presigned S3 URLs. Leave unset to keep presigned behaviour.
      # Setup: backend/aws/CLOUDFRONT_CDN.md
      - key: MEDIA_CDN_BASE_URL
        sync: false
      # Image generation (WeekView "Create image" — Gemini "nano banana").
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        sync: false

  # Every 10 minutes: publish scheduled posts whose slot has passed (a failed
  # post backs off between tries — services/schedulePublish.js).
  - type: cron
    name: igsignal-publish-due
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/scripts/publishDue.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        fromService:
          type: web
          name: igsignal-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: SCHEDULE_CRON_SECRET
        fromService:
          type: web
          name: igsignal-api
          envVarKey: SCHEDULE_CRON_SECRET
      - key: MONGO_URI
        fromService:
          type: web
          name: igsignal-api
          envVarKey: MONGO_URI
      - key: META_PUBLISH_LIVE
        fromService:
          type: web
          name: igsignal-api
          envVarKey: META_PUBLISH_LIVE
      - key: INSTAGRAM_APP_ID
        fromService:
          type: web
          name: igsignal-api
          envVarKey: INSTAGRAM_APP_ID
      - key: INSTAGRAM_APP_SECRET
        fromService:
          type: web
          name: igsignal-api
          envVarKey: INSTAGRAM_APP_SECRET
      - key: AWS_REGION
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_REGION
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: S3_BUCKET_NAME
        fromService:
          type: web
          name: igsignal-api
          envVarKey: S3_BUCKET_NAME

  # ── Queued post generation ──────────────────────────────────────────────
  # Redis for the plan queue (and the shared AI rate-limit counters). A plan
  # with persistence, noeviction so queued jobs are never dropped.
  - type: keyvalue
    name: igsignal-queue
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Next step — a separate worker so generation never shares the API's memory.
  # Uncomment, give it the API's env (every key the API has set in the
  # dashboard, e.g. via an env group), then set PLAN_WORKER_IN_API to "0" on
  # igsignal-api.
  # - type: worker
  #   name: igsignal-gen-worker
  #   runtime: node
  #   region: oregon
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: npm install
  #   startCommand: node src/workers/index.js
  #   envVars:
  #     - key: REDIS_URL
  #       fromService: { type: keyvalue, name: igsignal-queue, property: connectionString }
  #     - key: PLAN_QUEUE
  #       value: "1"
  #     # …plus the same MONGO_URI, OPENAI_API_KEY, ANTHROPIC_API_KEY, AWS_*,
  #     # S3_BUCKET_NAME and MEDIA_CDN_BASE_URL values as igsignal-api
  #     # (fromService: igsignal-api, envVarKey: …).

  - type: web
    name: igsignal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: igsignal-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ── Bauhly backoffice (internal) ─────────────────────────────────────────
  - type: web
    name: bauhly-backoffice-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backoffice-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Reuse the customer API's Atlas URI — same database, no second secret to fill.
      - key: MONGO_URI
        fromService:
          type: web
          name: igsignal-api
          envVarKey: MONGO_URI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      # Browser origins allowed by CORS (comma-separated): the custom domain and
      # the static site's onrender.com URL.
      - key: CLIENT_URL
        value: https://backoffice.bauhly.com,https://bauhly-backoffice-web.onrender.com
      # Customers › Activity post previews load slide photos from the media CDN.
      - key: MEDIA_CDN_BASE_URL
        fromService:
          type: web
          name: igsignal-api
          envVarKey: MEDIA_CDN_BASE_URL
      # Customers › Delete removes the customer's media (projects/<id>/, reports/<id>/).
      - key: AWS_REGION
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_REGION
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: S3_BUCKET_NAME
        fromService:
          type: web
          name: igsignal-api
          envVarKey: S3_BUCKET_NAME
      - key: APIFY_TOKEN
        fromService:
          type: web
          name: igsignal-api
          envVarKey: APIFY_TOKEN
      - key: APIFY_INSTAGRAM_PROFILE_ACTOR
        value: apify/instagram-profile-scraper
      - key: APIFY_INSTAGRAM_POST_ACTOR
        value: apify/instagram-post-scraper
      - key: COLLECTION_POSTS_PER_ACCOUNT
        value: "40"
      - key: COLLECTION_CONCURRENCY
        value: "3"
      - key: COLLECTION_BACKFILL_DAYS
        value: "30"
      - key: COLLECTION_BACKFILL_POSTS
        value: "90"
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  - type: web
    name: bauhly-backoffice-web
    runtime: static
    rootDir: bauhlybackoffice
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # DNS (GoDaddy): CNAME backoffice → bauhly-backoffice-web.onrender.com
    domains:
      - backoffice.bauhly.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Origin only — the UI appends /api/backoffice at build/runtime.
      - key: VITE_BACKOFFICE_API_URL
        fromService:
          type: web
          name: bauhly-backoffice-api
          envVarKey: RENDER_EXTERNAL_URL

  # ── Bauhly content generator (strategy → IG posts / carousels / video) ───
  - type: web
    name: bauhly-content-generator
    runtime: node
    region: oregon
    # Generation (Claude + ffmpeg) routinely exceeds free-tier request limits.
    plan: starter
    rootDir: Bauhly-content-generator
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: ANTHROPIC_API_KEY
      - key: MODEL
        value: claude-sonnet-5
      # Optional — enables real text-to-image when Asset Planner fills gaps.
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_VIDEOS
        value: "12"
