# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo, or sync an existing Blueprint.
services:
  # ── Customer product ─────────────────────────────────────────────────────
  - type: web
    name: igsignal-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: igsignal-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_INSTAGRAM_PROFILE_ACTOR
        value: apify/instagram-profile-scraper
      - key: APIFY_INSTAGRAM_POST_ACTOR
        value: apify/instagram-post-scraper
      - key: INSTAGRAM_POSTS_LIMIT
        value: "12"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Meta Instagram Content Publishing (Connect with Meta → publish to IG).
      - key: META_APP_ID
        value: "965034379672554"
      # Secret: set in the Render dashboard, never committed. Use the value from
      # Meta AFTER clicking Reset (the one in chat/screenshots is compromised).
      - key: META_APP_SECRET
        sync: false
      # Must exactly match a Valid OAuth Redirect URI in the Meta app. This is the
      # frontend (igsignal-web) callback route.
      - key: META_REDIRECT_URI
        value: https://igsignal-web.onrender.com/dashboard/meta/callback
      # 1 enables live Graph publishing; needs public HTTPS image URLs (see notes).
      - key: META_PUBLISH_LIVE
        value: "0"
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REPORT_PRESIGN_EXPIRY_SECONDS
        value: "3600"
      # CloudFront CDN base URL for project media (e.g. https://d111abcdef8.cloudfront.net
      # or a custom domain). When set, media is served from stable, cacheable CDN
      # URLs instead of presigned S3 URLs. Leave unset to keep presigned behaviour.
      # Setup: backend/aws/CLOUDFRONT_CDN.md
      - key: MEDIA_CDN_BASE_URL
        sync: false
      # Image generation (WeekView "Create image" — Gemini "nano banana").
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        sync: false

  - type: web
    name: igsignal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: igsignal-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ── Bauhly backoffice (internal) ─────────────────────────────────────────
  - type: web
    name: bauhly-backoffice-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backoffice-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Reuse the customer API's Atlas URI — same database, no second secret to fill.
      - key: MONGO_URI
        fromService:
          type: web
          name: igsignal-api
          envVarKey: MONGO_URI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CLIENT_URL
        fromService:
          type: web
          name: bauhly-backoffice-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APIFY_TOKEN
        fromService:
          type: web
          name: igsignal-api
          envVarKey: APIFY_TOKEN
      - key: APIFY_INSTAGRAM_PROFILE_ACTOR
        value: apify/instagram-profile-scraper
      - key: APIFY_INSTAGRAM_POST_ACTOR
        value: apify/instagram-post-scraper
      - key: COLLECTION_POSTS_PER_ACCOUNT
        value: "40"
      - key: COLLECTION_CONCURRENCY
        value: "3"
      - key: COLLECTION_BACKFILL_DAYS
        value: "30"
      - key: COLLECTION_BACKFILL_POSTS
        value: "90"
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  - type: web
    name: bauhly-backoffice-web
    runtime: static
    rootDir: bauhlybackoffice
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Origin only — the UI appends /api/backoffice at build/runtime.
      - key: VITE_BACKOFFICE_API_URL
        fromService:
          type: web
          name: bauhly-backoffice-api
          envVarKey: RENDER_EXTERNAL_URL

  # ── Bauhly content generator (strategy → IG posts / carousels / video) ───
  - type: web
    name: bauhly-content-generator
    runtime: node
    region: oregon
    # Generation (Claude + ffmpeg) routinely exceeds free-tier request limits.
    plan: starter
    rootDir: Bauhly-content-generator
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: igsignal-api
          envVarKey: ANTHROPIC_API_KEY
      - key: MODEL
        value: claude-sonnet-5
      # Optional — enables real text-to-image when Asset Planner fills gaps.
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_VIDEOS
        value: "12"
